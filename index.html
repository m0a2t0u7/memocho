<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>メモ帳</title>
<meta name="theme-color" content="#f7f4ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メモ帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--paper:#f7f4ea;--line:#d9e3ef;--ink:#333;--sub:#888;--me:#8fd46b;--other:#fff;--bar:#ffffffee;--bg:#e6ecf2}
@media (prefers-color-scheme:dark){:root{--paper:#22252a;--line:#30363d;--ink:#e8e8e8;--sub:#999;--me:#3f7d2c;--other:#353a41;--bar:#1b1e22ee;--bg:#15181c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--paper)}
.hide{display:none!important}
/* ログイン（メモ帳風） */
#login{min-height:100%;padding:calc(env(safe-area-inset-top) + 48px) 24px 24px;
 background:repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);}
#login h1{font-size:22px;font-weight:600;margin:0 0 32px;line-height:32px}
#login input{display:block;width:100%;font-size:16px;padding:6px 2px;margin:0 0 26px;border:0;border-bottom:1px solid var(--sub);background:transparent;color:var(--ink);outline:none}
#login button{font-size:16px;padding:10px 22px;border:1px solid var(--sub);border-radius:8px;background:transparent;color:var(--ink)}
#err{color:#c44;font-size:14px;min-height:20px;margin-top:12px}
/* チャット */
#chat{display:flex;flex-direction:column;height:100%;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bar);border-bottom:1px solid var(--line);font-weight:600}
header button{border:0;background:none;color:var(--sub);font-size:13px}
#list{flex:1;overflow-y:auto;padding:12px 10px;-webkit-overflow-scrolling:touch}
.day{text-align:center;font-size:12px;color:var(--sub);margin:10px 0}
.row{display:flex;align-items:flex-end;gap:6px;margin:6px 0}
.row.me{flex-direction:row-reverse}
.who{font-size:11px;color:var(--sub);margin:0 0 2px 4px}
.bubble{max-width:72vw;padding:8px 12px;border-radius:16px;background:var(--other);white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:15px}
.me .bubble{background:var(--me)}
.bubble img{display:block;max-width:60vw;max-height:50vh;border-radius:10px}
.bubble.pic{padding:3px;background:transparent}
.meta{font-size:10px;color:var(--sub);white-space:nowrap;text-align:right}
form{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--bar);border-top:1px solid var(--line)}
#text{flex:1;resize:none;font-size:16px;max-height:120px;padding:8px 12px;border-radius:18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit}
.ic{border:0;background:none;font-size:22px;padding:4px 6px;color:var(--sub)}
#send{color:#3a8f1f;font-weight:700;font-size:16px}
</style>
</head>
<body>

<section id="login">
  <h1>メモ帳</h1>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="loginBtn">開く</button>
  <div id="err"></div>
</section>

<section id="chat" class="hide">
  <header><span>メモ帳</span><button id="logout">閉じる</button></header>
  <div id="list"></div>
  <form id="form">
    <button type="button" class="ic" id="picBtn" aria-label="画像">＋</button>
    <input type="file" id="pic" accept="image/*" class="hide">
    <textarea id="text" rows="1" placeholder="メモを書く"></textarea>
    <button class="ic" id="send">送信</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limitToLast, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== ここを自分のFirebase設定に置き換える ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAt4B92I02kxuRn3KlnKXHzUHbA1F1rsbY",
  authDomain: "family-memo-a266e.firebaseapp.com",
  projectId: "family-memo-a266e",
  storageBucket: "family-memo-a266e.firebasestorage.app",
  messagingSenderId: "968805223037",
  appId: "1:968805223037:web:8de1ad82ece5759bc37f14"
};
/* ===== 表示名（メール→名前） ===== */
const NAMES = { "ken2799@gmail.com": "Ken" };
/* ================================================ */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence);

const $ = id => document.getElementById(id);
let unsubMsg = null, unsubRead = null, me = null;
let msgs = [], otherRead = 0;

$("loginBtn").onclick = async () => {
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("err").textContent = "開けませんでした"; }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsubMsg) unsubMsg(); if (unsubRead) unsubRead();
  me = user;
  $("login").classList.toggle("hide", !!user);
  $("chat").classList.toggle("hide", !user);
  if (!user) return;
  const q = query(collection(db, "messages"), orderBy("createdAt"), limitToLast(300));
  unsubMsg = onSnapshot(q, snap => {
    msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(true); markRead();
  }, () => alert("読み込めません。許可リストを確認してください"));
  unsubRead = onSnapshot(collection(db, "reads"), snap => {
    otherRead = 0;
    snap.forEach(d => { if (d.id !== me.uid) otherRead = Math.max(otherRead, d.data().at?.toMillis?.() || 0); });
    render(false);
  });
});

function markRead() {
  if (!me || document.hidden) return;
  setDoc(doc(db, "reads", me.uid), { at: serverTimestamp() }).catch(() => {});
}
document.addEventListener("visibilitychange", markRead);

const pad = n => String(n).padStart(2, "0");
function render(scroll) {
  const list = $("list");
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.innerHTML = "";
  let lastDay = "";
  for (const m of msgs) {
    const t = m.createdAt?.toDate?.() || new Date();
    const day = `${t.getFullYear()}/${t.getMonth() + 1}/${t.getDate()}`;
    if (day !== lastDay) { lastDay = day; list.insertAdjacentHTML("beforeend", `<div class="day">${day}</div>`); }
    const mine = m.uid === me.uid;
    const row = document.createElement("div");
    row.className = "row" + (mine ? " me" : "");
    const wrap = document.createElement("div");
    if (!mine) { const w = document.createElement("div"); w.className = "who"; w.textContent = m.name || ""; wrap.append(w); }
    const b = document.createElement("div");
    b.className = "bubble" + (m.img ? " pic" : "");
    if (m.img) { const im = new Image(); im.src = m.img; im.onclick = () => window.open(m.img); b.append(im); }
    else b.textContent = m.text;
    wrap.append(b);
    const meta = document.createElement("div");
    meta.className = "meta";
    const read = mine && m.createdAt && m.createdAt.toMillis() <= otherRead;
    meta.innerHTML = (read ? "既読<br>" : "") + `${pad(t.getHours())}:${pad(t.getMinutes())}`;
    row.append(wrap, meta);
    list.append(row);
  }
  if (scroll || atBottom) list.scrollTop = list.scrollHeight;
}

async function post(data) {
  await addDoc(collection(db, "messages"), {
    ...data, uid: me.uid, name: NAMES[me.email] || me.email, createdAt: serverTimestamp()
  });
}

const ta = $("text");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });
$("form").onsubmit = async e => {
  e.preventDefault();
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ""; ta.style.height = "auto";
  try { await post({ text }); } catch { alert("送れませんでした"); ta.value = text; }
};

$("picBtn").onclick = () => $("pic").click();
$("pic").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { await post({ img: await shrink(f) }); } catch { alert("画像を送れませんでした"); }
};
// 画像を圧縮（Firestoreの1件1MB制限内に収める）
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  let max = 1280, q = 0.75, url;
  for (let i = 0; i < 6; i++) {
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    url = c.toDataURL("image/jpeg", q);
    if (url.length < 700000) return url;
    max *= 0.8; q -= 0.08;
  }
  throw new Error("too big");
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
